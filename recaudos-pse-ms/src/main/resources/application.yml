server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: recaudos-pse-ms
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:bancoias_pse}
    username: ${DB_USER:bancoias}
    password: ${DB_PASSWORD:bancoias}
    pool:
      initial-size: 5
      max-size: 20
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  jackson:
    default-property-inclusion: non_null

app:
  cors:
    allowed-origins: http://localhost:4200
  payments:
    recent-default-limit: 20
    recent-max-limit: 100

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.bancoias.pse: INFO
